<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usfans LeakMap</title>
    <meta
      name="description"
      content="Nowoczesna strona z przyciskiem przekierowującym do Usfans LeakMap."
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top left, #18a0fb 0%, #0b2a58 35%, #040c16 100%);
        color: #edf2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .page {
        width: min(100%, 680px);
        text-align: center;
      }

      .panel {
        padding: 3rem 2.5rem;
        border-radius: 32px;
        background: rgba(9, 18, 39, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 32px 90px rgba(3, 13, 40, 0.35);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        display: inline-flex;
        margin-bottom: 1rem;
        padding: 0.55rem 1rem;
        border-radius: 999px;
        background: rgba(56, 114, 255, 0.18);
        color: #a8c9ff;
        font-size: 0.88rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 4vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      p {
        margin: 1.6rem auto 2.5rem;
        max-width: 40rem;
        color: #d7e1ff;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.2rem 2rem;
        border-radius: 999px;
        border: none;
        font-size: 1rem;
        font-weight: 700;
        color: #0b1b37;
        background: linear-gradient(135deg, #ffffff, #d4e5ff);
        text-decoration: none;
        transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        box-shadow: 0 18px 45px rgba(17, 59, 133, 0.22);
      }

      .cta:hover,
      .cta:focus-visible {
        transform: translateY(-2px);
        filter: brightness(1.05);
        box-shadow: 0 24px 60px rgba(17, 59, 133, 0.28);
      }

      .footer {
        margin-top: 2rem;
        color: #8fa8df;
        font-size: 0.95rem;
      }

      @media (max-width: 520px) {
        .panel {
          padding: 2rem 1.5rem;
        }

        p {
          margin-bottom: 2rem;
        }

        .cta {
          width: 100%;
          padding: 1.1rem 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Przejdź do Usfans LeakMap</h1>
        <p>

        </p>
        <a
          class="cta"
          href="https://szurikenno.github.io/usfans_leakmap/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Usfans Leak Map
        </a>
      </section>
    </main>
  </body>
</html>
